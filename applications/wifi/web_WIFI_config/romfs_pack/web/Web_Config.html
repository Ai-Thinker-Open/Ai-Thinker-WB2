    <script type="text/javascript">
        var acitveTab = 'setup'

        var path = ''
        var mNetworkSSID = ''
        var networkScanFilled = false
        var initialWiFiScanScheduled = false
        var isScanning = false

        function scheduleInitialWiFiScanOnce() {
            if (initialWiFiScanScheduled) {
                return;
            }
            initialWiFiScanScheduled = true;
            scanWiFi('Network', 3500, true);
        }

        function applySyncedNetworkToSelect(networkStr) {
            var networkSelectionEle = clearSelect('Network');
            var s = (networkStr == null || networkStr === undefined) ? '' : String(networkStr).trim();
            if (s !== '') {
                networkSelectionEle.options.add(new Option(s, s));
                networkSelectionEle.selectedIndex = 0;
            } else {
                networkSelectionEle.options.add(new Option('Select a network', ''));
                networkSelectionEle.selectedIndex = 0;
            }
        }

        function fillNetworkFormFromRes(res) {
            if (!res || !res.NEWORK || !res.PLATFORM) {
                return;
            }
            $id('Password').value = res.NEWORK.Password || '';
            mNetworkSSID = res.NEWORK.Network || '';
            applySyncedNetworkToSelect(mNetworkSSID);
            var tcp = res.PLATFORM.TCPParam;
            if (tcp) {
                $id('URL').value = tcp.URL || '';
                $id('port').value = (tcp.port !== undefined && tcp.port !== null) ? tcp.port : '';
            }
        }

        function onNetworkSelectOpen(ev) {
            if (ev && ev.button !== 0) {
                return;
            }
            if (networkScanFilled || isScanning) {
                return;
            }
            scanWiFi('Network', 3500, true);
        }

        window.onload = function() {
            scanRouterLists();
        }

        function scanRouterLists() {
            http('get', '/getNetWorkInfo').then(function(res) {
                fillNetworkFormFromRes(res);
                scheduleInitialWiFiScanOnce();
            }, function(err) {
                http('get', '/getNetWorkInfo').then(function(res) {
                    fillNetworkFormFromRes(res);
                    scheduleInitialWiFiScanOnce();
                }, function(err2) {
                    scheduleInitialWiFiScanOnce();
                });
            });
        }

        function pollGetNetworkAfterScan(select, clearFirst, attempt, maxAttempts, gapMs) {
            http('get', '/getNetWork').then(function(res) {
                var ok = res && res.code === 1 && res.data && res.data.length > 0;
                if (ok) {
                    select.innerHTML = '';
                    res.data.forEach(function(network) {
                        select.add(new Option(network, network));
                    });
                    var keep = mNetworkSSID;
                    for (var j = 0; j < select.options.length; j++) {
                        if (select.options[j].value === keep) {
                            select.selectedIndex = j;
                            break;
                        }
                    }
                    networkScanFilled = true;
                    if (clearFirst) {
                        select.disabled = false;
                    }
                    isScanning = false;
                    return;
                }
                if (attempt + 1 < maxAttempts) {
                    setTimeout(function() {
                        pollGetNetworkAfterScan(select, clearFirst, attempt + 1, maxAttempts, gapMs);
                    }, gapMs);
                } else {
                    if (clearFirst) {
                        select.disabled = false;
                    }
                    isScanning = false;
                }
            }).catch(function() {
                if (attempt + 1 < maxAttempts) {
                    setTimeout(function() {
                        pollGetNetworkAfterScan(select, clearFirst, attempt + 1, maxAttempts, gapMs);
                    }, gapMs);
                } else {
                    if (clearFirst) {
                        select.disabled = false;
                    }
                    isScanning = false;
                }
            });
        }

        //发起扫描请求：preserveOptions=true 时保留当前选项直至拿到扫描列表（用于同步显示 + 后台扫描）
        function scanWiFi(selectId, waitTime, preserveOptions) {
            selectId = selectId || 'Network'
            if (waitTime === undefined || waitTime === null) {
                waitTime = 3500
            }
            if (isScanning) {
                console.log('Scan already in progress')
                return
            }
            isScanning = true
            var select = document.getElementById(selectId)
            if (!select) {
                isScanning = false
                return
            }
            var clearFirst = !preserveOptions
            if (clearFirst) {
                select.disabled = true
                select.innerHTML = ''
            }
            var pollGap = 500
            var pollMax = 6
            http('get', '/scan').then(function() {
                setTimeout(function() {
                    pollGetNetworkAfterScan(select, clearFirst, 0, pollMax, pollGap)
                }, waitTime)
            }).catch(function() {
                if (clearFirst) {
                    select.disabled = false
                }
                isScanning = false
            })
        }

        // NetWork 获取路由器列表
        function getNetworkOptions() {
            http('get', '/getNetWork').then(function(res) {
                if (res.code == 1) {
                    var list = res.data;
                    var networkSelectionEle = clearSelect("Network");
                    for (var i = 0; i < list.length; i++) {
                        networkSelectionEle.options.add(new Option(list[i], list[i]));
                    }
                    networkScanFilled = true;
                    var ele = $id("Network");
                    for (var j = 0; j < list.length; j++) {
                        if (list[j] === mNetworkSSID) {
                            ele.selectedIndex = j;
                            break;
                        }
                    }
                } else {
                    alert(res.msg)
                }
            }, function(err) {
                alert(err.message)
            })
        }

        function showAlert(message) {
            const overlay = document.getElementById("alertOverlay");
            const msgBox = document.getElementById("alertMsg");

            msgBox.textContent = message;

            overlay.style.display = "flex";

            document.getElementById("alertBtn").onclick = function() {
                overlay.style.display = "none";

        function saveAll() {
            var params = {
                NEWORK: {
                    Network: getSelectValue('Network'),
                    Password: $id('Password').value,
                },

                    TCPParam: {
                        confirm: 0,

        function saveInfo() {

        }

            for (var i = 0; i < select.options.length; i++) {
                if (select.options[i].value == checkValue) {
                    select.options[i].selected = true;
                    break;
                }
            }
        }

        //设置select选中 
        function setSelectCheckedFromIndex(selectId, index) {
            var select = $id(selectId);
            if (!(index > select.options.length - 1)) {
                select.options[index].selected = true;
            }
        }

        // 设置下拉框的值
        function setSelectValue(id, value) {
            var ele = $id(id)
            ele.selectedIndex = (value);
        }

        // 清除下拉框
        function clearSelect(id) {
            var ele = $id(id);
            var length = ele.length;
            for (var i = 0; i < length; i++) {
                ele.remove(0);
            }
            return ele;

        function $id(ele) {
            return document.getElementById(ele)
        }

        function getNum(id) {

            return Number(val)
        }

        // 切换密码显示隐藏
        function changeEye(num) {
            if (num == -1) {
                $id('eyeOpen').style.display = 'none'
                $id('eyeClose').style.display = 'block'
                $id('Password').setAttribute('type', 'password')
            } else {
                $id('eyeClose').style.display = 'none'
                $id('eyeOpen').style.display = 'block'
                $id('Password').setAttribute('type', 'text')
            }
        }
        // http请求方法封装
        function http(type, url, data) {
            const promise = new Promise(function(resolve, reject) {
                function handle() {
                    if (this.readyState != 4) {
                        return;
                    }
                    if (this.status != 200) {
                        reject(new Error(this.statusText || String(this.status)));
                        return;
                    }
                    var text = this.responseText || '';
                    text = text.trim();
                    if (!text) {
                        resolve(null);
                        return;
                    }
                    try {
                        resolve(JSON.parse(text));
                    } catch (e) {
                        reject(e);
                    }
                }
                var method = String(type || 'GET').toUpperCase();
                var xml = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject("Microsoft.XMLHttp");
                xml.timeout = 20000;
                xml.ontimeout = function() {
                    reject(new Error('Timed out'));
                };
                xml.open(method, path + url);
                xml.responseType = 'text';
                xml.onreadystatechange = handle;
                if (method === 'GET') {
                    xml.send();
                } else {
                    xml.setRequestHeader("Content-Type", "application/json");
                    xml.send(JSON.stringify(data));
                }
            })
            return promise;
        }

    function addEvent(obj, sEv, fn) {
        if (obj.addEventListener) {
            obj.addEventListener(sEv, function(ev) {
                var oEvent = ev || event;
                if (fn.call(obj, oEvent) == false) {
                    oEvent.cancelBubble = true;

            });

    }

    function getByClass(oParent, sClass) {
        if (oParent.getElementsByClassName) {
            return oParent.getElementsByClassName(sClass);
        } else {
            var aResult = [];
            var aEle = oParent.getElementsByTagName('*');
            var re = new RegExp('\\b' + sClass + '\\b', 'g');
            for (var i = 0; i < aEle.length; i++) {
                if (aEle[i].className.search(re) != -1) {
                    aResult.push(aEle[i]);
                }
            }
            return aResult;
        }
    }

    function getByStr(aParent, str) {
        var aChild = [];
        //遍历父级
        for (var i = 0; i < aParent.length; i++) {
            switch (str.charAt(0)) {
                case '#':
                    //#id
                    aChild.push(document.getElementById(str.substring(1)));
                    break;
                case '.':
                    //.class
                    var aEle = getByClass(aParent[i], str.substring(1));
                    for (var j = 0; j < aEle.length; j++) {
                        aChild.push(aEle[j]);
                    }
                    break;
                default:
                    if (/^\w+\.\w+$/.test(str)) {
                        //筛选
                        //li.on
                        var arr = str.split('.');
                        var re = new RegExp('\\b' + arr[1] + '\\b', 'g');
                        var aEle = aParent[i].getElementsByTagName(arr[0]);
                        for (var j = 0; j < aEle.length; j++) {
                            if (aEle[j].className.search(re) != -1) {
                                aChild.push(aEle[j]);
                            }
                        }
                    } else if (/^\w+\[\w+\=\w+\]$/.test(str)) {
                        //属性
                        var arr = str.split(/\[|\=|\]/);
                        var aEle = aParent[i].getElementsByTagName(arr[0]);
                        for (var j = 0; j < aEle.length; j++) {
                            if (aEle[j].getAttribute(arr[1]) == arr[2]) {
                                aChild.push(aEle[j]);
                            }
                        }
                    } else if (/^\w+\:\w+(\(\d+\))?$/.test(str)) {
                        var arr = str.split(/\:|\(|\)/);
                        var aEle = aParent[i].getElementsByTagName(arr[0]);
                        switch (arr[1]) {
                            case 'first':
                                aChild.push(aEle[0]);
                                break;
                            case 'last':
                                aChild.push(aEle[aEle.length - 1]);
                                break;
                            case 'even':
                                for (var j = 0; j < aEle.length; j += 2) {
                                    aChild.push(aEle[j]);
                                }
                                break;
                            case 'odd':
                                for (var j = 1; j < aEle.length; j += 2) {
                                    aChild.push(aEle[j]);
                                }
                                break;
                            case 'eq':
                                aChild.push(aEle[arr[2]]);
                                break;
                            case 'lt':
                                for (var j = 0; j < arr[2]; j++) {
                                    aChild.push(aEle[j]);
                                }
                                break;
                            case 'gt':
                                for (var j = parseInt(arr[2]) + 1; j < aEle.length; j++) {

                                }
                                break;
                        }
                    } else {
                        //标签
                        var aEle = aParent[i].getElementsByTagName(str);
                        for (var j = 0; j < aEle.length; j++) {
                            aChild.push(aEle[j]);
                        }
                    }
                    break;
            }
        }
        return aChild;
    }

    function getEle(str) {
        var arr = str.replace(/^\s+|\s+$/g, '').split(/\s+/);
        var aParent = [document];

        for (var i = 0; i < arr.length; i++) {

            aParent = aChild;

    function move(obj, json, options) {

        var dis = {};
        for (var name in json) {
            start[name] = parseFloat(getStyle(obj, name));
            dis[name] = json[name] - start[name];
        }
        var n = 0;
        obj.timer = setInterval(function() {
            n++;
            for (var name in json) {
                switch (options.easing) {
                    case 'linear':
                        var a = n / count;
                        var cur = start[name] + dis[name] * a;
                        break;
                    case 'ease-in':
                        var a = n / count;
                        var cur = start[name] + dis[name] * a * a * a;
                        break;
                    case 'ease-out':
                        var a = 1 - n / count;
                        var cur = start[name] + dis[name] * (1 - a * a * a);
                        break;
                }
                if (name == 'opacity') {
                    obj.style.opacity = cur;
                    obj.style.filter = 'alpha(opacity:' + cur * 100 + ')';
                } else {
                    obj.style[name] = cur + 'px';
                }
            }
            if (n == count) {
                clearInterval(obj.timer);
                options.complete && options.complete();
            }
        }, 30);
    }

                } else {
                    try {

                    } catch (e) {

                }
            }
        }
    }

        if (arguments.length == 1) {

            eval("***.style." + arguments[0] + "='" + arguments[1] + "'");
            return this;

    }

        if (arguments.length == 1) {
            return eval("this." + arguments[0]);
        } else if (arguments.length == 2) {
            eval("this." + arguments[0] + "=" + arguments[1]);
            return this;
        }
    }
